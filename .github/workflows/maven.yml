name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest--arm64
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        cache: maven

    - name: Build with Maven
      run: mvn -B package
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
